<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a4a4a;
            overflow-x: hidden;
            position: relative;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 10;
            margin: 20px 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #ff4757;
            margin-bottom: 10px;
        }
        p {
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        /* Tombol Musik */
        .music-control {
            margin-bottom: 20px;
        }
        .music-btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.3);
        }
        .music-btn:hover {
            background-color: #ff4757;
        }

        .quiz-section {
            margin-top: 20px;
            border-top: 2px dashed #f1f2f6;
            padding-top: 20px;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            margin: 5px;
        }
        button:hover {
            background-color: #ff6b81;
        }
        #quiz-result {
            margin-top: 15px;
            font-weight: bold;
            color: #2ed573;
        }

        /* Styling Galeri Polaroid */
        .polaroid-gallery {
            margin-top: 25px;
            border-top: 2px dashed #f1f2f6;
            padding-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .polaroid {
            background: white;
            padding: 10px 10px 25px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 120px;
            border-radius: 4px;
            transition: transform 0.3s ease, z-index 0.3s;
        }
        .polaroid:nth-child(1) {
            transform: rotate(-4deg);
        }
        .polaroid:nth-child(2) {
            transform: rotate(4deg);
        }
        .polaroid:hover {
            transform: scale(1.08) rotate(0deg);
            z-index: 20;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
        .polaroid img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 2px;
        }
        .polaroid span {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
            font-family: cursive, sans-serif;
        }

        /* Styling untuk Animasi Hati Berjatuhan */
        .falling-heart {
            position: absolute;
            top: -10px;
            color: rgba(255, 71, 87, 0.6);
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Elemen Audio (Jalur disesuaikan agar sejajar dengan file index.html) -->
    <audio id="bg-music" loop>
        <source src="myaudio.mp3" type="audio/mpeg">
        Browser kamu tidak mendukung pemutar audio.
    </audio>

    <div class="card">
        <h1>Happy Birthday My Bub! 🎉</h1>
        
        <!-- Tombol Kontrol Musik -->
        <div class="music-control">
            <button class="music-btn" id="music-toggle" onclick="toggleMusic()">🎵 Putar Musik</button>
        </div>

        <p>Hai! My honey bany sweety Website kecil ini kubuat khusus buat kamu. Terima kasih sudah jadi bagian terbaik dalam hari-hariku. Semoga semua impianmu tercapai ya dan sehat selalu!</p>
        
        <div class="quiz-section">
            <h3>Kuis Kecil Kita </h3>
            <p>Seberapa ingat kamu tanggal jadian kita?</p>
            <button onclick="jawab('salah')">Lumayan ingat</button>
            <button onclick="jawab('benar')">Sangat ingat</button>
            <p id="quiz-result"></p>
        </div>

        <!-- Galeri Foto Polaroid -->
        <div class="polaroid-gallery">
            <div class="polaroid">
                <img src="yaa.png" alt="we">
                <span>Our Memory 💖</span>
            </div>
            <div class="polaroid">
                <img src="sya.jpeg" alt="you">
                <span>Best Days ✨</span>
            </div>
        </div>
    </div>

    <script>
        // Fungsi untuk Kontrol Musik (Play/Pause)
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = '🎵 Putar Musik';
                musicBtn.style.backgroundColor = '#ff6b81';
            } else {
                music.play().then(() => {
                    musicBtn.innerHTML = '⏸️ Jeda Musik';
                    musicBtn.style.backgroundColor = '#2ed573';
                }).catch(error => {
                    console.log("Gagal memutar audio: ", error);
                    alert("Pastikan file 'myaudio.mp3' sudah di-upload ke GitHub bersama file index.html!");
                });
            }
            isPlaying = !isPlaying;
        }

        function jawab(status) {
            const result = document.getElementById('quiz-result');
            if(status === 'benar') {
                result.style.color = '#2ed573';
                result.innerHTML = 'Yeay! Benar banget, pokoknya hari di mana kita deket terus! ❤️';
            } else {
                result.style.color = '#ff4757';
                result.innerHTML = 'Ih, kok salah! Coba ingat-ingat lagi dong! 😜';
            }
        }

        // Fungsi untuk membuat elemen hati berjatuhan
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            const duration = Math.random() * 3 + 3;
            heart.style.animationDuration = duration + 's';
            document.body.appendChild(heart);
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 300);
    </script>

</body>
</html>
